<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIDM — Sistema Multiagente</title>
  <!-- vis-network STANDALONE — incluye DataSet, DataView y Network en un solo archivo -->
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.9/styles/vis-network.min.css">
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --surface2:#21262d;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* ── HEADER ─────────────────────────────── */
    header {
      height: 50px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 14px; flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
    header .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .legend { display: flex; gap: 14px; align-items: center; margin-left: auto; }
    .li { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    .ld { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .zbns { display: flex; gap: 4px; margin-left: 14px; }
    .zb {
      width: 28px; height: 28px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center; transition: background .12s;
    }
    .zb:hover { background: var(--border); }

    /* ── MAIN ───────────────────────────────── */
    main { display: flex; flex: 1; overflow: hidden; }
    #gwrap { flex: 1; position: relative; overflow: hidden; }
    #net   { width: 100%; height: 100%; }

    /* ── SIDEBAR ────────────────────────────── */
    #sb {
      width: 420px; min-width: 300px;
      background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
      transition: width .22s ease;
    }
    #sb.closed { width: 0; min-width: 0; border: none; }

    /* Sidebar inner */
    #sb-inner {
      display: flex; flex-direction: column; height: 100%;
    }
    #sb-placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 12px; color: var(--muted); text-align: center; padding: 32px;
    }
    #sb-placeholder .ico { font-size: 44px; opacity: .3; }
    #sb-placeholder p { font-size: 13px; line-height: 1.6; max-width: 240px; }

    #sb-head {
      padding: 16px 20px 14px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; display: flex; flex-direction: column; gap: 0;
    }
    #sb-head-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .sb-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .7px;
      padding: 3px 8px; border-radius: 4px; color: #fff;
    }
    .sb-close-btn {
      width: 26px; height: 26px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--muted); cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sb-close-btn:hover { color: var(--text); background: var(--border); }
    .sb-title { font-size: 18px; font-weight: 700; margin-bottom: 7px; line-height: 1.2; }
    .sb-desc  { font-size: 13px; color: var(--muted); line-height: 1.6; }

    #sb-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
    #sb-body::-webkit-scrollbar { width: 4px; }
    #sb-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Content components */
    .sec { margin-bottom: 22px; }
    .sec-t {
      font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); margin-bottom: 9px;
      padding-bottom: 5px; border-bottom: 1px solid var(--border);
    }

    .meta { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; }
    .mk { font-size: 12px; color: var(--muted); align-self: center; white-space: nowrap; }
    .mv {
      font-size: 11px; font-family: 'Consolas', monospace;
      background: var(--surface2); padding: 3px 7px; border-radius: 3px;
      color: var(--text); word-break: break-all;
    }

    .steps { display: flex; flex-direction: column; gap: 8px; }
    .step  { display: flex; gap: 10px; font-size: 12px; line-height: 1.55; color: var(--text); }
    .sn {
      width: 21px; height: 21px; min-width: 21px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; color: var(--muted);
      display: flex; align-items: center; justify-content: center; margin-top: 1px;
    }

    .blist { display: flex; flex-direction: column; gap: 5px; }
    .blist li {
      list-style: none; font-size: 12px; line-height: 1.55; color: var(--text);
      padding-left: 14px; position: relative;
    }
    .blist li::before { content: '›'; position: absolute; left: 0; color: var(--muted); }

    .agent-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 13px; margin-bottom: 8px;
    }
    .ac-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .ac-role { font-size: 11px; color: var(--muted); margin-bottom: 7px; line-height: 1.4; }
    .ac-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid;
      white-space: nowrap;
    }
    .t-llm  { border-color: #8b5cf6; color: #c4b5fd; background: rgba(139,92,246,.12); }
    .t-in   { border-color: #3b82f6; color: #93c5fd; background: rgba(59,130,246,.12); }
    .t-out  { border-color: #10b981; color: #6ee7b7; background: rgba(16,185,129,.12); }
    .t-tool { border-color: #ec4899; color: #f9a8d4; background: rgba(236,72,153,.12); }
    .t-file { border-color: #f59e0b; color: #fde68a; background: rgba(245,158,11,.12); }

    .code {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 12px; font-family: 'Consolas', monospace;
      font-size: 11px; color: #a5d6ff; white-space: pre; overflow-x: auto; line-height: 1.5;
    }

    .io-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 5px; }
    .io-lbl {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      width: 52px; min-width: 52px; padding-top: 4px;
    }
    .io-lbl.in  { color: #3b82f6; }
    .io-lbl.out { color: #10b981; }
    .io-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  </style>
</head>
<body>

<header>
  <h1>🧠 AIDM</h1>
  <span class="sub">Arquitectura del Sistema Multiagente · Haz clic en un bloque para ver los detalles</span>
  <div class="legend">
    <div class="li"><div class="ld" style="background:#06b6d4"></div>UI / Entrada</div>
    <div class="li"><div class="ld" style="background:#a855f7"></div>Orquestador</div>
    <div class="li"><div class="ld" style="background:#3b82f6"></div>Fase / Agentes</div>
    <div class="li"><div class="ld" style="background:#ef4444;border-radius:50%"></div>Router</div>
    <div class="li"><div class="ld" style="background:#10b981"></div>Output</div>
    <div class="li"><div class="ld" style="background:#f59e0b"></div>Datos</div>
  </div>
  <div class="zbns">
    <button class="zb" id="zi">+</button>
    <button class="zb" id="zo">−</button>
    <button class="zb" id="zf" style="font-size:12px" title="Ajustar todo">⊡</button>
  </div>
</header>

<main>
  <div id="gwrap">
    <div id="net">
      <div id="ldg" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#8b949e;text-align:center;font-size:14px;">
        <div style="font-size:34px;margin-bottom:10px">⏳</div>Cargando diagrama…
      </div>
    </div>
  </div>

  <div id="sb">
    <div id="sb-inner">
      <!-- State A: placeholder -->
      <div id="sb-placeholder">
        <div class="ico">👆</div>
        <p>Haz clic en cualquier bloque del diagrama para ver sus detalles técnicos completos.</p>
      </div>
      <!-- State B: node detail (hidden until click) -->
      <div id="sb-head" style="display:none"></div>
      <div id="sb-body" style="display:none; flex:1; overflow-y:auto; padding:18px 20px;"></div>
    </div>
  </div>
</main>

<script>
// ─────────────────────────────────────────────────────────
// GUARD
// ─────────────────────────────────────────────────────────
if (typeof vis === 'undefined' || !vis.DataSet) {
  document.getElementById('net').innerHTML =
    '<p style="color:#ef4444;padding:40px;font-size:14px">❌ Error: vis-network no se pudo cargar. Verifica tu conexión y recarga la página.</p>';
  throw new Error('vis-network no disponible');
}

// ─────────────────────────────────────────────────────────
// SIDEBAR CONTENT  (datos técnicos por nodo)
// ─────────────────────────────────────────────────────────
const DETAILS = {

  user: {
    badge: 'Entrada', color: '#06b6d4',
    title: 'Usuario Final',
    desc: 'Punto de entrada del sistema. La persona describe su proyecto de Data & AI en lenguaje natural a través del chat de Streamlit.',
    html: `
      <div class="sec">
        <div class="sec-t">Interacción</div>
        <ul class="blist">
          <li>Escribe mensajes en lenguaje natural describiendo su proyecto</li>
          <li>Responde las preguntas del Discovery Agent para completar el caso</li>
          <li>Al terminar el discovery, recibe el reporte completo abierto en el navegador</li>
          <li>La interfaz queda bloqueada para nuevos inputs tras completar el flujo</li>
        </ul>
      </div>
      <div class="sec">
        <div class="sec-t">Tip de uso</div>
        <ul class="blist">
          <li>No hace falta dar toda la información de golpe — el agente pregunta lo que falta</li>
          <li>El sistema puede manejar múltiples turnos de conversación antes de pasar al análisis</li>
        </ul>
      </div>`
  },

  streamlit: {
    badge: 'Interfaz UI', color: '#06b6d4',
    title: 'Streamlit Interface',
    desc: 'Frontend conversacional que gestiona el historial de chat, invoca el grafo LangGraph y abre el reporte HTML final en el navegador cuando el discovery está completo.',
    html: `
      <div class="sec">
        <div class="sec-t">Archivo fuente</div>
        <div class="meta">
          <span class="mk">Ruta</span><span class="mv">interface.py</span>
          <span class="mk">Framework</span><span class="mv">Streamlit</span>
          <span class="mk">Layout</span><span class="mv">centered</span>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">Flujo de ejecución</div>
        <div class="steps">
          <div class="step"><div class="sn">1</div><span>Captura el prompt con <code style="color:#a5d6ff">st.chat_input()</code> — si no hay prompt, <code style="color:#a5d6ff">st.stop()</code></span></div>
          <div class="step"><div class="sn">2</div><span>Añade el mensaje al historial en <code style="color:#a5d6ff">st.session_state.messages</code></span></div>
          <div class="step"><div class="sn">3</div><span>Llama a <code style="color:#a5d6ff">run_graph(prompt, chat_history)</code> dentro de un spinner</span></div>
          <div class="step"><div class="sn">4</div><span>Si <code style="color:#a5d6ff">completion_reached == False</code>: muestra la respuesta en el chat y espera el siguiente turno</span></div>
          <div class="step"><div class="sn">5</div><span>Si <code style="color:#a5d6ff">completion_reached == True</code>: llama a <code style="color:#a5d6ff">webbrowser.open(path_html)</code> y bloquea la UI</span></div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">Estado de sesión</div>
        <ul class="blist">
          <li><b>messages</b>: lista de dicts {role, content} — historial completo del chat</li>
          <li><b>solution_completed</b>: bool — bloquea nuevos inputs cuando es True</li>
        </ul>
      </div>`
  },

  langgraph: {
    badge: 'Orquestador', color: '#a855f7',
    title: 'LangGraph StateGraph',
    desc: 'Motor de orquestación principal. Define el grafo dirigido con nodos (funciones Python) y aristas de control, manteniendo el estado compartido entre todos los agentes a través de AgentState.',
    html: `
      <div class="sec">
        <div class="sec-t">Archivo fuente</div>
        <div class="meta">
          <span class="mk">Ruta</span><span class="mv">graph.py</span>
          <span class="mk">Framework</span><span class="mv">LangGraph</span>
          <span class="mk">Tipo</span><span class="mv">StateGraph</span>
          <span class="mk">Entry</span><span class="mv">run_graph(user_prompt, chat_history)</span>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">AgentState — Estado compartido (TypedDict)</div>
        <div class="code">class AgentState(TypedDict):
    user_prompt:        str
    chat_history:       list[dict[str, str]]
    assistant_response: str
    problem_case:       dict[str, Any]
    completion_reached: bool
    problem_solution:   dict[str, Any]
    roadmap:            str</div>
      </div>
      <div class="sec">
        <div class="sec-t">Nodos registrados</div>
        <ul class="blist">
          <li><b>discovery</b> → discovery_node() en graph.py</li>
          <li><b>structure_proposal</b> → structure_proposal_node()</li>
          <li><b>solution_building</b> → solution_building_node()</li>
          <li><b>roadmap</b> → roadmap_node()</li>
        </ul>
      </div>
      <div class="sec">
        <div class="sec-t">Aristas del grafo</div>
        <ul class="blist">
          <li>START → discovery (siempre)</li>
          <li>discovery → <i>route_after_discovery</i> (condicional)</li>
          <li>structure_proposal → solution_building (directa)</li>
          <li>solution_building → roadmap (directa)</li>
          <li>roadmap → END (directa)</li>
        </ul>
      </div>`
  },

  discovery: {
    badge: 'Fase 1 — Discovery', color: '#3b82f6',
    title: 'Discovery Phase',
    desc: 'Entrevista conversacional multi-turno para recopilar toda la información del proyecto del cliente. Un único agente de CrewAI rellena incrementalmente un JSON estructurado (problem_case.json) hasta que todos los campos estén cubiertos.',
    html: `
      <div class="sec">
        <div class="sec-t">Archivo fuente</div>
        <div class="meta">
          <span class="mk">Ruta</span><span class="mv">agents/discovery_agent_logic.py</span>
          <span class="mk">Framework</span><span class="mv">CrewAI (1 crew · 1 agente)</span>
          <span class="mk">Proceso</span><span class="mv">Sequential</span>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">Flujo interno por turno</div>
        <div class="steps">
          <div class="step"><div class="sn">1</div><span>Carga el estado actual de <b>problem_case.json</b> y detecta campos pendientes</span></div>
          <div class="step"><div class="sn">2</div><span>Ejecuta el <b>discovery_agent</b> (CrewAI): analiza el prompt + historial y devuelve un JSON de actualizaciones</span></div>
          <div class="step"><div class="sn">3</div><span><b>_parse_plan()</b>: valida el JSON del LLM contra los campos permitidos</span></div>
          <div class="step"><div class="sn">4</div><span><b>_apply_plan()</b>: llama a <b>update_problem_scope_tool()</b> para escribir los cambios en el JSON</span></div>
          <div class="step"><div class="sn">5</div><span><b>_sync_status_with_content()</b>: re-sincroniza el campo <code style="color:#a5d6ff">status</code> en base a los campos pendientes reales (fallback de robustez)</span></div>
          <div class="step"><div class="sn">6</div><span>Genera la respuesta de chat para el usuario vía <b>_build_assistant_reply()</b></span></div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">Agente IA</div>
        <div class="agent-card">
          <div class="ac-name">🧠 discovery_agent</div>
          <div class="ac-role">Senior Strategy Consultant especializado en Data & AI. Metodología: "Diagnóstico antes de Prescripción". Agrupa preguntas para no abrumar al cliente y usa lenguaje de negocio.</div>
          <div class="ac-tags">
            <span class="tag t-llm">BIG_MODEL</span>
            <span class="tag t-tool">update_problem_scope_tool</span>
            <span class="tag t-file">agents.yaml</span>
          </div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">Campos del problem_case.json (17 + status)</div>
        <ul class="blist">
          <li><b>TEXT_FIELDS (17):</b> nombre_del_cliente, tipo_de_servicio, objetivo_del_proyecto, modelo_de_despliegue, cloud_provider, tipo_de_arquitectura, herramienta_de_visualizacion, enfoque_ai, integration_scope, volumen_de_datos, madurez_analitica_actual, tamano_equipo_tecnico, stack_tecnologico_actual, restriccion_presupuestaria, plazo_objetivo, regulacion_y_compliance, kpis_de_exito</li>
          <li><b>LIST_FIELDS (1):</b> evidencias — lista de textos libre</li>
          <li><b>status:</b> "pending fields" | "completed"</li>
        </ul>
      </div>
      <div class="sec">
        <div class="sec-t">Operaciones de la tool (update_problem_scope_tool)</div>
        <ul class="blist">
          <li><b>replace</b> — reemplaza el valor del campo (obligatorio para TEXT_FIELDS)</li>
          <li><b>append</b> — añade items a la lista (LIST_FIELDS)</li>
          <li><b>merge</b> — añade items únicos a la lista (LIST_FIELDS)</li>
        </ul>
      </div>`
  },

  router: {
    badge: 'Router Condicional', color: '#ef4444',
    title: 'route_after_discovery',
    desc: 'Función de enrutamiento condicional de LangGraph. Decide si el sistema continúa hacia la pipeline de análisis o termina el turno actual para esperar el siguiente mensaje del usuario.',
    html: `
      <div class="sec">
        <div class="sec-t">Archivo fuente</div>
        <div class="meta">
          <span class="mk">Función</span><span class="mv">route_after_discovery(state)</span>
          <span class="mk">Ruta</span><span class="mv">graph.py</span>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">Lógica de decisión</div>
        <div class="code">def route_after_discovery(state) -> str:
    if state.get("completion_reached"):
        return "structure_proposal"  # → continúa la pipeline
    return END                       # → vuelve control a Streamlit</div>
      </div>
      <div class="sec">
        <div class="sec-t">Condición de completion_reached</div>
        <ul class="blist">
          <li>Es <b>True</b> SOLO si en ESE turno el status pasó de "pending fields" a "completed"</li>
          <li>Evita re-activar la pipeline en sesiones donde el JSON ya estaba completo</li>
          <li>Si el LLM falla o no detecta la completitud, <b>_sync_status_with_content()</b> actúa como fallback determinista</li>
        </ul>
      </div>
      <div class="sec">
        <div class="sec-t">Por qué este diseño</div>
        <ul class="blist">
          <li>Permite conversaciones multi-turno sin necesidad de un grafo stateful entre sesiones</li>
          <li>El estado persiste entre turnos a través de <b>problem_case.json</b> en disco</li>
          <li>Cada invocación del grafo es completamente independiente</li>
        </ul>
      </div>`
  },

  structure: {
    badge: 'Fase 2 — Propuesta', color: '#3b82f6',
    title: 'Structure Proposal',
    desc: 'Primer nodo de la pipeline de análisis. Un Data Architect de CrewAI traduce el problem_case.json completo en una propuesta de arquitectura y servicios en texto, que servirá de contexto para todos los agentes posteriores.',
    html: `
      <div class="sec">
        <div class="sec-t">Archivo fuente</div>
        <div class="meta">
          <span class="mk">Ruta</span><span class="mv">agents/structure_proposal_agent_logic.py</span>
          <span class="mk">Framework</span><span class="mv">CrewAI (1 crew · 1 agente)</span>

          <div class="ac-tags">
            <span class="tag t-llm">BIG_MODEL</span>
            <span class="tag t-in">problem_case JSON</span>
            <span class="tag t-in">chat_history</span>
          </div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-t">Formato del output (3 secciones)</div>
        <ul class="blist">
          <li><b>Sección 1:</b> Introducción y contexto de la propuesta</li>
          <li><b>Sección 2:</b> Servicios y plataformas recomendados con justificación</li>
          <li><b>Sección 3:</b> Propuesta de arquitectura técnica detallada</li>
        </ul>
      </div>
      <div class="sec">
        <div class="sec-t">Rol en el sistema</div>
        <ul class="blist">
          <li>Su output (texto plano) se pasa como <b>structure_proposal</b> a todos los agentes de Solution Builder</li>
          <li>Actúa como "puente de contexto" entre el discovery y el análisis especializado</li>
        </ul>
      </div>`
  },

  solution: {
    badge: 'Fase 3 — Solución', color: '#3b82f6',
    title: 'Solution Builder',
    desc: 'Ejecuta dos CrewAI crews en secuencia con 6 agentes especializados. Genera la propuesta técnica completa del proyecto e inyecta los resultados en el reporte HTML mediante BeautifulSoup.',
    html: `
      <div class="sec">
        <div class="sec-t">Archivo fuente</div>

  // Router branches
  E('router', 'structure', 'SÍ ✓', {
    width: 2.5, color: { color: '#10b981', hover: '#34d399' },
    smooth: { type: 'straightCross', forceDirection: 'vertical' },
    font: { color: '#10b981', size: 11, bold: true },
    arrows: 'to'
  }),
  E('router', 'streamlit', 'NO — más\nturnos', {
    width: 2, dashes: [6, 4], color: { color: '#ef4444', hover: '#f87171' },
    smooth: { type: 'curvedCCW', roundness: 0.55 },
    font: { color: '#ef4444', size: 11 },
    arrows: 'to'
  }),

  // Rest of pipeline
  E('structure', 'solution', '', { ...FLOW_EDGE }),
  E('solution',  'roadmap',  '', { ...FLOW_EDGE }),
  E('roadmap',   'report',   '', { ...FLOW_EDGE }),

  // Report opens in browser (curved back)
  E('report', 'streamlit', 'abre en\nnavegador', {
    width: 1.5, dashes: [5, 4], color: { color: '#06b6d4', hover: '#22d3ee' },
    smooth: { type: 'curvedCW', roundness: 0.5 },
    font: { color: '#06b6d4', size: 10 },
    arrows: 'to'
  }),

  // Data side connections
  E('discovery', 'prob_json', 'lee / escribe', { ...DATA_EDGE, font: { color: '#b45309', size: 10 } }),
  E('prob_json', 'router',    'status check',  { ...DATA_EDGE, font: { color: '#b45309', size: 10 } }),
  E('config',    'langgraph', 'agentes + LLMs',{ ...DATA_EDGE, font: { color: '#b45309', size: 10 } }),
];

// ─────────────────────────────────────────────────────────
// NETWORK INIT
// ─────────────────────────────────────────────────────────
const container = document.getElementById('net');
const netData = {
  nodes: new vis.DataSet(NODES),
  edges: new vis.DataSet(EDGES)
};
const options = {
  physics: { enabled: false },
  interaction: {
    dragNodes: true, dragView: true, zoomView: true,
    hover: true, tooltipDelay: 300, multiselect: false
  },
  nodes: {
    widthConstraint: { minimum: 160, maximum: 200 },
  },
  edges: {
    font: { color: '#6b7280', size: 11, face: 'Segoe UI', align: 'middle', background: 'rgba(13,17,23,0.7)' },
    arrows: { to: { scaleFactor: 0.75 } }
  }
};

const network = new vis.Network(container, netData, options);

// Remove loading message and fit
const ldgEl = document.getElementById('ldg'); if (ldgEl) ldgEl.remove();
setTimeout(() => network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } }), 150);

// ─────────────────────────────────────────────────────────
// SIDEBAR LOGIC  — reemplazo directo del DOM, sin toggles
// ─────────────────────────────────────────────────────────
const sbPlaceholder = document.getElementById('sb-placeholder');
const sbHead        = document.getElementById('sb-head');
const sbBody        = document.getElementById('sb-body');

function openSidebar(nodeId) {
  console.log('[AIDM] openSidebar llamado con nodeId:', nodeId);
  const d = DETAILS[nodeId];
  if (!d) { console.warn('[AIDM] No hay detalle para nodo:', nodeId, '— claves disponibles:', Object.keys(DETAILS)); return; }

  // Ocultar placeholder, mostrar cabecera y cuerpo
  sbPlaceholder.style.display = 'none';
  sbHead.style.display        = 'block';
  sbBody.style.display        = 'block';

  // Cabecera
  sbHead.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <span class="sb-badge" style="background:${d.color}">${d.badge}</span>
      <button class="sb-close-btn" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sb-title">${d.title}</div>
    <div class="sb-desc">${d.desc}</div>
  `;

  // Cuerpo con scroll
  sbBody.innerHTML = d.html;
  sbBody.scrollTop = 0;
}

function closeSidebar() {
  sbPlaceholder.style.display = 'flex';
  sbHead.style.display        = 'none';
  sbBody.style.display        = 'none';
}

// ── Estrategia 1: vis.js selectNode (más fiable que click)
network.on('selectNode', function(params) {
  try {
    if (params.nodes && params.nodes.length > 0) {
      openSidebar(String(params.nodes[0]));
    }
  } catch(err) { console.error('[AIDM] selectNode error:', err); }
});

// ── Estrategia 2: vis.js click genérico (fallback)
network.on('click', function(params) {
  try {
    if (params.nodes && params.nodes.length > 0) {
      openSidebar(String(params.nodes[0]));
    } else {
      closeSidebar();
    }
  } catch(err) { console.error('[AIDM] click handler error:', err); }
});

// ── Estrategia 3: DOM listener nativo con getNodeAt (máxima fiabilidad)
// Bypasea el sistema de eventos de vis.js — funciona incluso si los eventos
// de vis no se disparan (p.ej. por DPI o problemas de canvas en Edge)
container.addEventListener('click', function(e) {
  try {
    var rect = container.getBoundingClientRect();
    var pointer = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    var nodeId = network.getNodeAt(pointer);
    if (nodeId !== undefined) {
      openSidebar(String(nodeId));
    }
  } catch(err) { console.error('[AIDM] DOM click fallback error:', err); }
});

// ─────────────────────────────────────────────────────────
// ZOOM CONTROLS
// ─────────────────────────────────────────────────────────
document.getElementById('zi').addEventListener('click', () =>
  network.moveTo({ scale: network.getScale() * 1.3, animation: { duration: 180 } }));
document.getElementById('zo').addEventListener('click', () =>
  network.moveTo({ scale: network.getScale() * 0.77, animation: { duration: 180 } }));
document.getElementById('zf').addEventListener('click', () =>
  network.fit({ animation: { duration: 350, easingFunction: 'easeInOutQuad' } }));
</script>
</body>
</html>
